; ==============================================================================
; PlatformIO Project Configuration - ESP32-S3 N16R8
; Hybrid USB Audio Interface (UAC2 48kHz 16-bit) + DLMS 2-In 4-Out
; ==============================================================================

[platformio]
default_envs = esp32-s3-n16r8-dlms

[env:esp32-s3-n16r8-dlms]
; Menggunakan platform espressif32 (atau pioarduino untuk Arduino-ESP32 3.x / IDF 5.x):
; platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

; --- Spesifikasi Hardware ESP32-S3 N16R8 (16MB QIO Flash + 8MB OPI PSRAM) ---
board_build.mcu = esp32s3
board_build.f_cpu = 240000000L
board_build.f_flash = 80000000L
board_build.flash_mode = qio
board_upload.flash_size = 16MB
board_upload.maximum_size = 3145728
board_upload.maximum_ram_size = 327680

; Wajib qio_opi agar 16MB QIO Flash + 8MB OPI PSRAM terdeteksi dan stabil
board_build.arduino.memory_type = qio_opi

; Custom Partition Table (OTA 2x3MB + LittleFS 8MB)
board_build.partitions = partitions_16mb.csv
board_build.filesystem = littlefs

; Serial Monitor & Upload Speed (460800 optimal dengan driver WCH CH34xVCPDriver)
upload_speed = 460800
monitor_speed = 115200
monitor_filters = esp32_exception_decoder

; Unit test murni PC berada di test/test_native_dsp -> abaikan pada target ESP32
test_ignore = test_native_*

; --- Unflag konfigurasi default USB CDC agar Native USB murni untuk UAC2 ---
build_unflags =
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1

; --- Build Flags: PSRAM, TinyUSB Audio UAC2, & Optimasi DSP ---
build_flags =
    ; Aktifkan 8MB OPI PSRAM
    -D BOARD_HAS_PSRAM
    ; Mode USB-OTG (TinyUSB) & nonaktifkan CDC pada port Native USB saat boot
    -D ARDUINO_USB_MODE=0
    -D ARDUINO_USB_CDC_ON_BOOT=0
    ; Aktifkan TinyUSB Audio built-in Arduino-ESP32 (USBAudioCard 48kHz 16-bit Stereo 2x2)
    -D CONFIG_TINYUSB_AUDIO_ENABLED=1
    ; Ekspos header FS.h/vfs_api.h agar library USB built-in (USBMSCFS.h) bisa dikompilasi di mode LDF chain
    -I"${platformio.packages_dir}/framework-arduinoespressif32/libraries/FS/src"
    ; Supresi peringatan driver legacy saat dikompilasi di IDF 5.x
    -D CONFIG_I2S_SUPPRESS_DEPRECATE_WARN=1
    -D CONFIG_PCNT_SUPPRESS_DEPRECATE_WARN=1
    ; Optimasi performa FPU / DSP real-time
    -O2
    -Wno-format
    -Wno-ignored-qualifiers
    -Wno-unused-variable

; --- Library Dependencies ---
lib_deps =
    ; Framework FS agar library USB (USBMSCFS.h) dapat mengakses FS.h
    FS
    ; Tahap 1: Hardware Control (USB Audio menggunakan USBAudioCard built-in Arduino-ESP32)
    madhephaestus/ESP32Encoder @ ^0.11.2

    ; Tahap 3: Layar TFT ILI9341 (240x320 SPI) dengan PSRAM Double-Buffering
    lovyan03/LovyanGFX @ ^1.1.16

    ; Tahap 4: WebSocket Real-Time Control & Telemetry (AU-WEB)
    links2004/WebSockets @ ^2.7.3

; ==============================================================================
; Native PC Unit Test Environment (Unity Framework - Tanpa Hardware ESP32-S3)
; Jalankan dengan: pio test -e native
; ==============================================================================
[env:native]
platform = native
test_framework = unity
test_build_src = yes
build_src_filter =
    -<*>
    +<dsp_engine.cpp>
build_flags =
    -D NATIVE_TEST
    -std=gnu++17
    -O2
    -Wall
    -Wextra
    -lm
